<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Las Condes — Bienvenida</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,500&family=Montserrat:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body>
    <div class="page page--lobby">
      <header class="site-header">
        <button
          class="menu-toggle"
          type="button"
          aria-label="Abrir menú"
          aria-controls="site-menu"
          aria-expanded="false"
        >
          <span></span><span></span><span></span>
        </button>
        <a class="site-logo" href="lobby.html" aria-label="Las Condes, inicio">
          <span class="brand-mark brand-mark--white"></span>
        </a>
        <a class="button button--gold" href="reservas.html">Reservar</a>
      </header>
      <main class="lobby-content reveal">
        <p class="eyebrow eyebrow--light">
          Hora en Las Condes Hotel & Golf Club
        </p>
        <time class="lobby-time" data-live-clock datetime=""
          ><span data-clock-hours>11</span
          ><span class="lobby-time__separator" aria-hidden="true">:</span
          ><span data-clock-minutes>43</span></time
        >
        <a class="lobby-cta" href="reservas.html">Reservá tu estadía</a>
      </main>
    </div>
    <div class="menu-backdrop" data-menu-close></div>
    <nav class="drawer" id="site-menu" aria-label="Navegación principal">
      <button
        class="drawer__close"
        type="button"
        data-menu-close
        aria-label="Cerrar menú"
      >
        ×
      </button>
      <p class="drawer__eyebrow">Las Condes</p>
      <a href="lobby.html">Inicio</a>
      <a href="nosotros.html">Sobre nosotros</a>
      <a href="reservas.html">Habitaciones</a>
      <a href="reservas.html">Reservas</a>
      <a href="#" aria-disabled="true">Contacto</a>
    </nav>
    <script src="assets/js/main.js"></script>
  </body>
</html>
