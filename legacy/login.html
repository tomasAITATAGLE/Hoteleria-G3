<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Iniciá sesión en Las Condes Hotel & Golf Club." />
    <title>Iniciar sesión — Las Condes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,500&family=Montserrat:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body class="pagina-login">
    <header class="encabezado">
      <button class="boton-menu" type="button" aria-label="Abrir menú">
        <span></span><span></span><span></span>
      </button>
      <a class="logo" href="lobby.html"><span class="marca marca-blanca"></span></a>
      <a class="boton boton-dorado" id="boton-reservar" href="reservas.html">Reservar</a>
    </header>

    <main class="login-contenido">
      <section class="login-tarjeta aparecer">
        <p class="subtitulo subtitulo-dorado">Las Condes</p>
        <h1>Iniciar sesión</h1>
        <p class="login-texto">Accedé a tu cuenta para gestionar tus reservas.</p>

        <form id="form-login" autocomplete="off" novalidate>
          <p class="mensaje-error" hidden></p>
          <label class="campo">
            <span>Correo electrónico</span>
            <input type="email" name="email" placeholder="nombre@correo.com" />
          </label>
          <label class="campo">
            <span>Contraseña</span>
            <input type="password" name="password" placeholder="••••••••" />
          </label>
          <div class="login-opciones">
            <label><input type="checkbox" name="recordarme" /> Recordarme</label>
            <a href="#">¿Olvidaste tu contraseña?</a>
          </div>
          <button class="boton-enviar" type="submit">Ingresar</button>
        </form>

        <p class="login-pie">
          ¿No tenés cuenta?
          <a href="registro.html" id="link-cuenta">Creá una aquí</a>
        </p>
      </section>
    </main>

    <footer class="pie">Elegancia. Exclusividad. Tradición.</footer>

    <div class="fondo-menu"></div>
    <nav class="menu">
      <button class="cerrar-menu" type="button" aria-label="Cerrar menú">×</button>
      <p class="menu-titulo">Las Condes</p>
      <a href="lobby.html">Inicio</a>
      <a href="nosotros.html">Sobre nosotros</a>
      <a href="reservas.html">Habitaciones</a>
      <a href="#" aria-disabled="true">Contacto</a>
      <a href="login.html" id="link-sesion">Iniciar sesión</a>
    </nav>

    <script src="assets/js/main.js"></script>
  </body>
</html>
